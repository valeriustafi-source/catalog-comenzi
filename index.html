<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#125a91"><link rel="manifest" href="manifest.webmanifest"><title>Catalog comenzi</title><link rel="stylesheet" href="style.css"></head><body><header><div><strong>Catalog comenzi</strong><small id="status">Catalog local · prețuri 07.06.2026</small></div><button id="ordersBtn" class="secondary">Comenzi</button></header><main><section id="catalogView"><div class="toolbar"><input id="search" type="search" placeholder="Caută produsul..." autocomplete="off"><select id="category"><option value="">Toate categoriile</option></select><select id="subcategory"><option value="">Toate subcategoriile</option></select></div><div id="count"></div><div id="grid" class="grid"></div></section><section id="cartView" hidden><button class="back" id="backBtn">← Înapoi la produse</button><h2>Comandă nouă</h2><input id="client" placeholder="Numele clientului"><div id="cartLines"></div><div class="sum">Total: <b id="cartTotal">0,00 mdl</b></div><button id="saveOrder" class="primary wide">Salvează comanda</button><p class="hint">Comenzile sunt salvate doar pe acest dispozitiv. Exportă periodic o copie de rezervă.</p></section><section id="ordersView" hidden><button class="back" id="ordersBack">← Înapoi</button><h2>Comenzi salvate</h2><button id="exportOrders" class="secondary">Export CSV (Excel)</button><div id="ordersList"></div></section></main><footer><div><small id="cartCount">0 produse</small><strong id="footerTotal">0,00 mdl</strong></div><button id="cartBtn" class="primary">Vezi comanda →</button></footer><dialog id="priceDialog"><form method="dialog"><h3>Preț pentru această comandă</h3><p id="priceName"></p><label>Preț special (mdl)<input id="priceInput" type="number" min="0" step="0.01" inputmode="decimal" required></label><div class="actions"><button value="cancel" class="secondary">Anulează</button><button id="priceSave" value="save" class="primary">Aplică</button></div></form></dialog><script src="app.js"></script></body></html>
